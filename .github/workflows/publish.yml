name: ci

on: [push]

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7'

      - name: Build gem
        run: gem build merge_ruby_client.gemspec

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7'

      - name: Run tests
        env:
          SDK_TESTING_KEY_SECONDARY: ${{ secrets.SDK_TESTING_KEY_SECONDARY }}
          SDK_TESTING_ACCOUNTING_ACCOUNT_TOKEN: ${{ secrets.SDK_TESTING_ACCOUNTING_ACCOUNT_TOKEN }}
          SDK_TESTING_ATS_ACCOUNT_TOKEN: ${{ secrets.SDK_TESTING_ATS_ACCOUNT_TOKEN }}
          SDK_TESTING_CRM_ACCOUNT_TOKEN: ${{ secrets.SDK_TESTING_CRM_ACCOUNT_TOKEN }}
          SDK_TESTING_FILE_STORAGE_ACCOUNT_TOKEN: ${{ secrets.SDK_TESTING_FILE_STORAGE_ACCOUNT_TOKEN }}
          SDK_TESTING_HRIS_ACCOUNT_TOKEN: ${{ secrets.SDK_TESTING_HRIS_ACCOUNT_TOKEN }}
          SDK_TESTING_TICKETING_ACCOUNT_TOKEN: ${{ secrets.SDK_TESTING_TICKETING_ACCOUNT_TOKEN }}
        run: bundle install && bundle exec rake test

  publish:
    needs: [ compile, test ]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7
          bundler-cache: true

      - name: Test gem
        env:
          SDK_TESTING_KEY_SECONDARY: ${{ secrets.SDK_TESTING_KEY_SECONDARY }}
          SDK_TESTING_ACCOUNTING_ACCOUNT_TOKEN: ${{ secrets.SDK_TESTING_ACCOUNTING_ACCOUNT_TOKEN }}
          SDK_TESTING_ATS_ACCOUNT_TOKEN: ${{ secrets.SDK_TESTING_ATS_ACCOUNT_TOKEN }}
          SDK_TESTING_CRM_ACCOUNT_TOKEN: ${{ secrets.SDK_TESTING_CRM_ACCOUNT_TOKEN }}
          SDK_TESTING_FILE_STORAGE_ACCOUNT_TOKEN: ${{ secrets.SDK_TESTING_FILE_STORAGE_ACCOUNT_TOKEN }}
          SDK_TESTING_HRIS_ACCOUNT_TOKEN: ${{ secrets.SDK_TESTING_HRIS_ACCOUNT_TOKEN }}
          SDK_TESTING_TICKETING_ACCOUNT_TOKEN: ${{ secrets.SDK_TESTING_TICKETING_ACCOUNT_TOKEN }}
        run: bundle install && bundle exec rake test

      - name: Build and Push Gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBY_GEMS_API_KEY }}
        run: |
          gem build merge_ruby_client.gemspec
          gem push merge_ruby_client-*.gem --host https://rubygems.org/
